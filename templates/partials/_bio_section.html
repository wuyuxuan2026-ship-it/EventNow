<div id="bio-section">
  <h4>About Me</h4>
  <blockquote class="blockquote">
    <p class="mb-0">{{ bio|default:"No bio yet." }}</p>
  </blockquote>
  <button class="btn btn-primary btn-sm"
          hx-post="{% url 'suggest_bio' user_id=user_id %}"
          hx-target="#bio-suggestions"
          hx-swap="innerHTML"
          hx-indicator="#bio-spinner">
    <i class="bi bi-stars"></i> Suggest Alternatives
  </button>
  <span id="bio-spinner" class="htmx-indicator">
    <span class="spinner-border spinner-border-sm" role="status"></span>
    Generating suggestions...
  </span>
  <div id="bio-suggestions" class="mt-3"></div>
</div>
