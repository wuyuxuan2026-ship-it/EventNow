<!--REF:The overall layout is based on Bootstrap-->
<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="bg-light">
    <!-- Header -->
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="{% url 'home' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
                <img src="https://images.unsplash.com/photo-1778148974394-5f0c5fe427f0?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="ICON" class="img-fluid rounded shadow" style="width: 60px; height:auto;">
                <span class="fs-4 fw-bold">&nbsp;EventNow</span>
            </a>

            <ul class="nav nav-pills">
                <li class="nav-item"><a href="{% url 'home' %}" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="{% url 'events' %}" class="nav-link">Events</a></li>
                <li class="nav-item"><a href="{% url 'login' %}" class="nav-link">Login</a></li>
                <li class="nav-item"><a href="{% url 'register' %}" class="nav-link">Register</a></li>
                <li class="nav-item"><a href="{% url 'dashboard' %}" class="nav-link">Status</a></li>
            </ul>
        </header>
    </div>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h2 class="mb-4 text-center">Create New Event</h2>

                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-success">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST" id="event-form">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" name="title" class="form-control" required>
                            </div>

                            <div id="description-wrapper" class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea name="description" id="event-description" class="form-control" rows="5" required></textarea>
                            </div>

                            

                                <span id="ai-spinner" class="htmx-indicator ms-2">
                                    <span class="spinner-border spinner-border-sm" role="status"></span>
                                    Generating suggestions...
                                </span>
                            </div>

                            <div id="ai-description-results" class="mb-4"></div>

                            <div class="mb-3">
                                <label class="form-label">Date</label>
                                <input type="date" name="date" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Location</label>
                                <input type="text" name="location" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <input type="text" name="category" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Capacity</label>
                                <input type="number" name="capacity" class="form-control" required>
                            </div>

                            
<hr class="my-4">
<h4 class="mb-3">Session Information</h4>

<div id="sessions-container">

    <div class="session-block border rounded p-3 mb-3">
        <h5>Session 1</h5>

        <div class="mb-3">
            <label class="form-label">Session Title</label>
            <input type="text" name="session_title" form="event-form" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Speaker</label>
            <input type="text" name="session_speaker" form="event-form" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" name="session_room" form="event-form" class="form-control">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Start Time</label>
                <input type="time" name="session_start_time" form="event-form" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">End Time</label>
                <input type="time" name="session_end_time" form="event-form" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Session Capacity</label>
            <input type="number" name="session_capacity" form="event-form" class="form-control" required>
        </div>
    </div>

</div>

<button type="button" class="btn btn-outline-primary mb-3" onclick="addSession()">
    Add another session
</button>

<br>

<button type="submit" class="btn btn-primary">Save Event</button>
<a href="{% url 'events' %}" class="btn btn-outline-secondary">Back</a>

</form>
<!--OpenAI offer idea for create more session at same event-->
<script>
    let sessionCount = 1;

    function addSession() {
        sessionCount++;

        const container = document.getElementById("sessions-container");

        const newSession = document.createElement("div");
        newSession.className = "session-block border rounded p-3 mb-3";

        newSession.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5>Session ${sessionCount}</h5>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.session-block').remove()">
                    Remove
                </button>
            </div>

            <div class="mb-3">
                <label class="form-label">Session Title</label>
                <input type="text" name="session_title" form="event-form" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Speaker</label>
                <input type="text" name="session_speaker" form="event-form" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" name="session_room" form="event-form" class="form-control">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Time</label>
                    <input type="time" name="session_start_time" form="event-form" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">End Time</label>
                    <input type="time" name="session_end_time" form="event-form" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Session Capacity</label>
                <input type="number" name="session_capacity" form="event-form" class="form-control" required>
            </div>
        `;

        container.appendChild(newSession);
    }
  
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@2.0.8"></script>

</body>
</html>
