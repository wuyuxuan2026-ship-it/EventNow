{% extends "base.html" %}

{% block title %}Edit Session{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">

                <h2 class="mb-4">Edit Session</h2>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Session Title</label>
                        <input type="text" name="session_title" class="form-control" value="{{ session.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Speaker</label>
                        <input type="text" name="session_speaker" class="form-control" value="{{ session.speaker }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" name="session_room" class="form-control" value="{{ session.room }}">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Time</label>
                            <input type="time" name="session_start_time" class="form-control" value="{{ session.start_time|time:'H:i' }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">End Time</label>
                            <input type="time" name="session_end_time" class="form-control" value="{{ session.end_time|time:'H:i' }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Session Capacity</label>
                        <input type="number" name="session_capacity" class="form-control" value="{{ session.capacity }}" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Session</button>
                    <a href="{% url 'detail' event.id %}" class="btn btn-outline-secondary">Cancel</a>
                </form>

            </div>
        </div>
    </div>
</section>
{% endblock %}
