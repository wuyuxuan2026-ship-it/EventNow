{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EventNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main/background.css' %}">
</head>
<div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="{% url 'home' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
                <img src="https://images.unsplash.com/photo-1778148974394-5f0c5fe427f0?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="ICON" class="img-fluid rounded shadow" style="width: 60px; height:auto;">
                <span class="fs-4 fw-bold">&nbsp;EventNow</span>
            </a>

            <ul class="nav nav-pills">
               <li class="nav-item"><a href="{% url 'home' %}" class="nav-link active">Home</a></li>
                <li class="nav-item"><a href="{% url 'events' %}" class="nav-link"aria-current="page">Events</a></li>
                <li class="nav-item"><a href="{% url 'login' %}" class="nav-link">Login</a></li>
                <li class="nav-item"><a href="{% url 'register' %}" class="nav-link">Register</a></li>
                <li class="nav-item"><a href="{% url 'dashboard' %}" class="nav-link">Status</a></li>
            </ul>
        </header>
         <form method="POST" id="event-form">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" value="{{ event.title }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="5" required>{{ event.description }}</textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" name="date" class="form-control" value="{{ event.date|date:'Y-m-d' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" value="{{ event.location }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" value="{{ event.category }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Capacity</label>
        <input type="number" name="capacity" class="form-control" value="{{ event.capacity }}" required>
    </div>

    <hr class="my-4">
    <h4 class="mb-3">Session Information</h4>

    <div class="mb-3">
        <label class="form-label">Session Title</label>
        <input type="text" name="session_title" class="form-control" value="{{ session.title }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Speaker</label>
        <input type="text" name="session_speaker" class="form-control" value="{{ session.speaker }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" name="session_room" class="form-control" value="{{ session.room }}">
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Start Time</label>
            <input type="time" name="session_start_time" class="form-control" value="{{ session.start_time|time:'H:i' }}" required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">End Time</label>
            <input type="time" name="session_end_time" class="form-control" value="{{ session.end_time|time:'H:i' }}" required>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Session Capacity</label>
        <input type="number" name="session_capacity" class="form-control" value="{{ session.capacity }}" required>
    </div>

    <button type="submit" class="btn btn-primary">Update Event</button>
    <a href="{% url 'detail' event.id %}" class="btn btn-outline-secondary">Cancel</a>
</form>
