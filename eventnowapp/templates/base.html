{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventNow</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
</head>

<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <style>
    .event-section .event-card {
        min-width: 250px;
        max-width: 100%;
    }

    .event-section .card-title {
        word-break: normal;
        overflow-wrap: normal;
        white-space: normal;
    }
</style>

    <!-- \ navbar -->
     <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="{% url 'home' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
                <img src="https://images.unsplash.com/photo-1778148974394-5f0c5fe427f0?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="EventNow logo" class="img-fluid rounded shadow" style="width: 60px; height:auto;">
                <span class="fs-4 fw-bold">&nbsp;EventNow</span>
            </a>

            <ul class="nav nav-pills">
                <li class="nav-item"><a href="{% url 'home' %}" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="{% url 'events' %}" class="nav-link">Events</a></li>
                <li class="nav-item"><a href="{% url 'login' %}" class="nav-link">Login</a></li>
                <li class="nav-item"><a href="{% url 'register' %}" class="nav-link">Register</a></li>
                <li class="nav-item"><a href="{% url 'dashboard' %}" class="nav-link">Status</a></li>
                <li class="nav-item"><a href="{% url 'myresume' %}" class="nav-link">Resume</a></li>
            </ul>
        </header>
    </div>

    <!-- content will appear at here -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>

</body>
</html>
