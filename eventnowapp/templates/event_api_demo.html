{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventNow Client-side API Demo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta name="api-base" content="{{ api_base }}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="organiser-id" content="{{ organiser_id }}">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">EventNow</a>
            <span class="navbar-text text-light">Client-side REST API Demo</span>
        </div>
    </nav>

    <main class="container py-5">
        <div class="mb-4">
            <h1>EventNow API Demo</h1>
            <p class="text-muted">
                This page uses JavaScript fetch() to communicate with the Django REST Framework API.
            </p>
        </div>

        <section class="card mb-4">
            <div class="card-header">
                Add New Event
            </div>

            <div class="card-body">
                <form id="eventForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Title</label>
                            <input type="text" id="title" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Date</label>
                            <input type="date" id="date" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Location</label>
                            <input type="text" id="location" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <input type="text" id="category" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Capacity</label>
                            <input type="number" id="capacity" class="form-control" min="1" required>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Description</label>
                            <textarea id="description" class="form-control" rows="3" required></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary mt-3">Add Event</button>
                </form>
            </div>
        </section>

        <section class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Event List</span>
                <button id="reloadBtn" class="btn btn-sm btn-outline-primary">Reload</button>
            </div>

            <div class="card-body">
                <div id="message" class="alert d-none"></div>

                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Date</th>
                                <th>Location</th>
                                <th>Category</th>
                                <th>Capacity</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="eventTableBody">
                            <tr>
                                <td colspan="7">Loading events...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_BASE = document.querySelector('meta[name="api-base"]').content;
        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
        const organiserId = document.querySelector('meta[name="organiser-id"]').content;

        const eventForm = document.getElementById('eventForm');
        const eventTableBody = document.getElementById('eventTableBody');
        const reloadBtn = document.getElementById('reloadBtn');
        const messageBox = document.getElementById('message');

        function showMessage(text, type = 'success') {
            messageBox.textContent = text;
            messageBox.className = `alert alert-${type}`;
            messageBox.classList.remove('d-none');

            setTimeout(() => {
                messageBox.classList.add('d-none');
            }, 3000);
        }

        async function apiRequest(path = '/', options = {}) {
            const config = {
                method: options.method || 'GET',
                headers: {
                    'X-CSRFToken': csrfToken,
                },
                credentials: 'same-origin',
            };

            if (options.body) {
                config.headers['Content-Type'] = 'application/json';
                config.body = JSON.stringify(options.body);
            }

            const response = await fetch(`${API_BASE}${path}`, config);

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText);
            }

            if (response.status === 204) {
                return null;
            }

            return response.json();
        }

        function getEventArray(data) {
            if (Array.isArray(data)) {
                return data;
            }

            if (data && Array.isArray(data.results)) {
                return data.results;
            }

            return [];
        }

        async function loadEvents() {
            try {
                const data = await apiRequest('/');
                const events = getEventArray(data);

                eventTableBody.innerHTML = '';

                if (events.length === 0) {
                    eventTableBody.innerHTML = `
                        <tr>
                            <td colspan="7">No events found.</td>
                        </tr>
                    `;
                    return;
                }

                events.forEach(event => {
                    const row = document.createElement('tr');

                    row.innerHTML = `
                        <td>${event.id}</td>
                        <td>${event.title}</td>
                        <td>${event.date}</td>
                        <td>${event.location}</td>
                        <td>${event.category}</td>
                        <td>${event.capacity}</td>
                        <td>
                            <button class="btn btn-sm btn-warning me-1" onclick="editEvent(${event.id}, '${event.title.replace(/'/g, "\\'")}')">
                                Edit
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteEvent(${event.id})">
                                Delete
                            </button>
                        </td>
                    `;

                    eventTableBody.appendChild(row);
                });

            } catch (error) {
                console.error(error);
                showMessage('Failed to load events.', 'danger');
            }
        }

        eventForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const newEvent = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                date: document.getElementById('date').value,
                location: document.getElementById('location').value,
                category: document.getElementById('category').value,
                capacity: Number(document.getElementById('capacity').value),
                organiser: Number(organiserId),
            };

            try {
                await apiRequest('/', {
                    method: 'POST',
                    body: newEvent,
                });

                eventForm.reset();
                showMessage('Event added successfully.');
                loadEvents();

            } catch (error) {
                console.error(error);
                showMessage('Failed to add event. Please check your input.', 'danger');
            }
        });

        async function deleteEvent(id) {
            const confirmed = confirm('Are you sure you want to delete this event?');

            if (!confirmed) {
                return;
            }

            try {
                await apiRequest(`/${id}/`, {
                    method: 'DELETE',
                });

                showMessage('Event deleted successfully.');
                loadEvents();

            } catch (error) {
                console.error(error);
                showMessage('Failed to delete event.', 'danger');
            }
        }

        async function editEvent(id, oldTitle) {
            const newTitle = prompt('Enter new event title:', oldTitle);

            if (!newTitle || newTitle.trim() === '') {
                return;
            }

            try {
                await apiRequest(`/${id}/`, {
                    method: 'PATCH',
                    body: {
                        title: newTitle.trim(),
                    },
                });

                showMessage('Event updated successfully.');
                loadEvents();

            } catch (error) {
                console.error(error);
                showMessage('Failed to update event.', 'danger');
            }
        }

        reloadBtn.addEventListener('click', loadEvents);

        loadEvents();
    </script>
</body>
</html>
