<!--REF:The overall layout is based on Bootstrap-->
<!doctype html>
{% load static %}
<html lang="en">
    
    <head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EventNow Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<!-- Header -->
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="{% url 'home' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
                <img src="https://images.unsplash.com/photo-1778148974394-5f0c5fe427f0?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="ICON" class="img-fluid rounded shadow" style="width: 60px; height:auto;">
                <span class="fs-4 fw-bold">&nbsp;EventNow</span>
            </a>

            <ul class="nav nav-pills">
                <li class="nav-item"><a href="{% url 'home' %}" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="{% url 'events' %}" class="nav-link">Events</a></li>
                <li class="nav-item"><a href="{% url 'login' %}" class="nav-link">Login</a></li>
                <li class="nav-item"><a href="{% url 'register' %}" class="nav-link active">Register</a></li>
                <li class="nav-item"><a href="{% url 'dashboard' %}" class="nav-link">Status</a></li>
                <li class="nav-item"><a href="{% url 'myresume' %}" class="nav-link">Resume</a></li>
            </ul>
        </header>
    </div>
    
  
    <main>
      <section class="py-5">
          <div class="container">
              <div class="row justify-content-center">
                  <div class="col-lg-6">
                      <h2 class="text-center mb-4">Register</h2>
                      <form method="POST">
                            {% csrf_token %}

    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" required>
    </div>

    <div class="mb-3">
        <label for="password1" class="form-label">Password</label>
        <input type="password" class="form-control" id="password1" name="password1" required>
    </div>

    <div class="mb-3">
        <label for="password2" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="password2" name="password2" required>
    </div>

    <div class="mb-3">
        <label for="firstname" class="form-label">First Name</label>
        <input type="text" class="form-control" id="firstname" name="first_name" required>
    </div>

    <div class="mb-3">
        <label for="lastname" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lastname" name="last_name" required>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
    </div>

    <button type="submit" class="btn btn-primary">Register</button>
</form>
                  </div>
              </div>
          </div>
      </section>
    </main>
  
    
                </div>
            </div>
        </div>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>


    <footer class="mt-auto py-3 my-4">
        <div class="container">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item"><a href="/home/" class="nav-link px-2 text-body-secondary">Home</a></li>
                <li class="nav-item"><a href="/event/" class="nav-link px-2 text-body-secondary">Events</a></li>
                <li class="nav-item"><a href="/login/" class="nav-link px-2 text-body-secondary">Login</a></li>
                <li class="nav-item"><a href="/register/" class="nav-link px-2 text-body-secondary">Register</a></li>
                <li class="nav-item"><a href="/dashboard/" class="nav-link px-2 text-body-secondary">Status</a></li>
            </ul>
            <p class="text-center text-body-secondary mb-0">© 2026 EventNow | INFS3202 Project</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
